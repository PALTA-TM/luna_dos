<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Artiste</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body class="bg-clair">

  <!-- 1. EN-TÊTE : Image à gauche, Texte à droite -->
  <header class="section-grid bg-sombre">
    <div class="image-container">
      <img id="image-entete" src="images/luna.png" alt="Photo de l'artiste">
    </div>
    <div class="text-container">
      <h1 id="nom-artiste"></h1>
      <p id="bio-artiste" class="subtitle"></p>
    </div>
  </header>

  <!-- 2. LECTEUR AUDIO (Spotify ou autre) ENTRE L'EN-TÊTE ET LE CARROUSEL -->
  <section class="section-full bg-clair" style="padding: 2rem 5%;">
    <div class="lecteur-audio-container" style="max-width: 600px; margin: 0 auto; text-align: center;">
      <!-- Insère ton iframe Spotify ou ton lecteur audio ici -->
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/43dbio5objvJqwHxGCjBZI?utm_source=generator&theme=0&si=aa520aedc5224a1f" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <!-- Exemple Spotify : <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/..." width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe> -->
    </div>
  </section>

  <main>
    <!-- 3. SECTION GALERIE / CARROUSEL : Texte/Boutons à gauche, Images à droite -->
    <section class="section-grid bg-clair">
      <div class="text-container">
        <h2>Mes Créations</h2>
        <p class="subtitle">Découvrez mon univers et mes pièces uniques.</p>
        <div class="carrousel-boutons">
          <button id="btn-prev">❮ Précédent</button>
          <button id="btn-next">Suivant ❯</button>
        </div>
      </div>
      <div class="image-container carrousel-droite-container">
        <div id="galerie-liste" class="galerie-container">
          <!-- Les œuvres s'affichent ici une par une -->
        </div>
      </div>
    </section>

    <!-- 4. SECTION MARCHÉS & EXPOSITIONS -->
    <section class="section-grid bg-sombre reverse-mobile">
      <div class="text-container">
        <h2>Mes Marchés & Expositions</h2>
        <ul id="marches-liste" class="agenda-liste">
          <!-- La liste des marchés sera injectée par script.js -->
        </ul>
      </div>
      <div id="zone-affichage-droite" class="image-container">
        <!-- Carte Google Maps dynamique -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

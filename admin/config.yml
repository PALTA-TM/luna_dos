backend:
  name: github
  repo: PALTA-TM/luna_dos
  branch: main
  site_domain: luna-dos-2eo.pages.dev
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Contenu du Site"
    files:
      - file: "content/oeuvres.json"
        label: "Mes Créations (Galerie)"
        name: "oeuvres"
        fields:
          - label: "Liste des œuvres"
            name: "oeuvres"
            widget: "list"
            fields:
              - {label: "Titre de l'œuvre", name: "titre", widget: "string"}
              - {label: "Prix", name: "prix", widget: "string"}
              - {label: "Photo", name: "image", widget: "image"}

      - file: "content/marches.json"
        label: "Mes Marchés / Expositions"
        name: "marches"
        fields:
          - label: "Liste des marchés"
            name: "marches"
            widget: "list"
            fields:
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Ville", name: "ville", widget: "string"}
              - {label: "Lieu exact", name: "lieu", widget: "string"}

  - name: "profil_collection"
    label: "Profil & En-tête"
    files:
      - file: "data/profil.json"      # Chemin vers le fichier JSON
        name: "profil"
        label: "Informations du Profil"
        fields:
          - { label: "Nom ou Titre d'en-tête", name: "nom_artiste", widget: "string" }
          - { label: "Photo d'en-tête / Bannière", name: "image_en_tete", widget: "image" }
          - { label: "Texte de présentation / Bio", name: "bio", widget: "text" }
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Artiste</title>
  <link rel="stylesheet" href="style.css">
  <!-- Script Decap CMS (Identity) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- EN-TÊTE / BANNIÈRE DE L'ARTISTE -->
  <header class="entete-artiste">
    <div class="conteneur-entete">
      <img id="image-entete" src="images/banniere.jpg" alt="Photo de l'artiste ou bannière">
      <h1 id="nom-artiste">Nom de l'artiste</h1>
      <p id="bio-artiste">Chargement de la présentation...</p>
    </div>
  </header>

  <!-- SECTION GALERIE / MES CRÉATIONS -->
  <main>
    <section class="section-galerie">
      <h2>Mes Créations</h2>
      <div class="carrousel-conteneur">
        <button id="btn-prev" class="btn-carrousel">❮</button>
        <div id="galerie-liste" class="galerie-grille">
          <!-- Les œuvres seront injectées ici par script.js -->
        </div>
        <button id="btn-next" class="btn-carrousel">❯</button>
      </div>
    </section>

    <!-- SECTION MARCHÉS & EXPOSITIONS -->
    <section class="section-marches">
      <h2>Mes Marchés & Expositions</h2>
      <div class="marches-conteneur">
        <ul id="marches-liste">
          <!-- La liste des marchés sera injectée ici par script.js -->
        </ul>
        <div id="zone-affichage-droite" class="carte-fictive">
          <p>Cliquez sur "Voir sur la carte" pour afficher la localisation.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

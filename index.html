<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Artiste</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-clair">

  <!-- EN-TÊTE / BANNIÈRE DE L'ARTISTE -->
  <header class="section-grid bg-sombre">
    <div class="text-container">
      <h1 id="nom-artiste">Luna</h1>
      <p id="bio-artiste" class="subtitle">Chargement de la présentation...</p>
    </div>
    <div class="image-container">
      <img id="image-entete" src="images/luna.png" alt="Photo de l'artiste">
    </div>
  </header>

  <main>
    <!-- SECTION GALERIE / MES CRÉATIONS -->
    <section class="section-full">
      <h2>Mes Créations</h2>
      <div class="carrousel-wrapper">
        <div id="galerie-liste" class="galerie-container">
          <!-- Les œuvres seront injectées ici par script.js -->
        </div>
        <div class="carrousel-boutons">
          <button id="btn-prev">❮ Précédent</button>
          <button id="btn-next">Suivant ❯</button>
        </div>
      </div>
    </section>

    <!-- SECTION MARCHÉS & EXPOSITIONS -->
    <section class="section-grid bg-sombre reverse-mobile">
      <div class="text-container">
        <h2>Mes Marchés & Expositions</h2>
        <ul id="marches-liste" class="agenda-liste">
          <!-- La liste des marchés sera injectée par script.js -->
        </ul>
      </div>
      <div id="zone-affichage-droite" class="image-container">
        <!-- Carte Google Maps dynamique -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
